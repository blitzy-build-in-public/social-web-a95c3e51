# Rendered by the nginx entrypoint to /etc/nginx/conf.d/default.conf; reads API_ORIGIN, the API's bare origin.

# A query-free access-log path, as in web.conf: the console's polled routes carry no useful query string.
map $request_uri $tm_path {
    default      $request_uri;
    "~^([^?]*)"  $1;
}

log_format tm_noquery '$remote_addr - $remote_user [$time_local] "$request_method $tm_path $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';

# Hashed bundles are immutable; everything else revalidates, so a redeployed page is never stale.
map $uri $tm_cache_control {
    default      "no-cache";
    "~^/assets/" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    # No [::]:80: the published port and the compose healthcheck both reach the container on 127.0.0.1.

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log tm_noquery;

    # Every add_header is declared here and never inside a location: a location-level one replaces the
    # inherited set and would drop this policy there. The policy matches what the console is built for: a
    # same-origin bundle and stylesheet, the API as the only cross-origin origin, and no inline script or
    # style (tokens go through CSSOM, and `zod-jitless.ts` keeps Zod off `new Function`).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ${API_ORIGIN}; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Deliberately without `always`: a 404 must not be cached as immutable for a year.
    add_header Cache-Control $tm_cache_control;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Liveness for the compose healthcheck, independent of the built bundle.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed names: a missing file is a 404, never the entry document served as a script.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # The console routes by client path (`/`, `/venue`, `/lodging`), so every other path serves the entry
    # document and the app renders its own "Page not found".
    location / {
        try_files $uri /index.html;
    }
}
