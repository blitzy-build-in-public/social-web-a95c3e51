# Rendered by the nginx entrypoint to /etc/nginx/conf.d/default.conf inside `http {}`; reads
# WEB_ORIGIN, the browser origin of the web app, and nothing else.

# The artefact file names are stable across circuit builds, so immutable caching is safe only because
# every client verifies a download against the manifest's SHA-256 and fetches it again on a mismatch.
# The query an artefact link may carry is ignored for file lookup, so it maps to the same file. The
# manifest itself always revalidates: its URL is stable too, and it is the reference those checks are
# made against, so a stale copy would vouch for the wrong key.
map $uri $tm_cache_control {
    default                    "no-cache";
    /tablemate_itinerary.wasm  "public, max-age=31536000, immutable";
    /tablemate_itinerary.zkey  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    # No [::]:80: the published port and the compose healthcheck both reach the container on 127.0.0.1.

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/artifacts;
    autoindex off;

    # gzip would disable byte ranges and drop the Content-Length the native client's resumable
    # download and its progress reporting both read, and the proving key is already compressed.
    gzip off;
    # One range per response: what a resumed download asks for, without the multipart bookkeeping.
    max_ranges 1;

    # Every add_header is declared here and never inside a location, because a location-level one
    # replaces the whole inherited set and would drop this policy there. `always` carries them on 206,
    # 304, 404 and 416 responses too, and on the preflight 204. The single origin below must equal the
    # browser-facing web origin exactly, because a browser refuses an allow-origin that is not its own
    # and the web app's Content-Security-Policy admits only that origin; one fixed value needs no
    # Vary: Origin, and a native download sends no Origin and is unaffected by the CORS headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "${WEB_ORIGIN}" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Access-Control-Max-Age "86400" always;
    # Deliberately without `always`: a 404, which is what every artefact request answers before
    # `pnpm circuits:build` has produced the build directory, must never be cached.
    add_header Cache-Control $tm_cache_control;

    # Liveness for the compose healthcheck. It reads no file, so the service is healthy before the
    # artefacts exist, which is when the native smoke check starts it alone.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The three files that may be published, and no other file of the build directory. A return-only
    # `if` is the safe form inside a location, and every server-level header still applies here.
    location = /tablemate_itinerary.wasm {
        # Required by WebAssembly.instantiateStreaming.
        types { application/wasm wasm; }
        if ($request_method = OPTIONS) { return 204; }
    }

    location = /tablemate_itinerary.zkey {
        types { }
        default_type application/octet-stream;
        if ($request_method = OPTIONS) { return 204; }
    }

    location = /artifacts.manifest.json {
        types { application/json json; }
        if ($request_method = OPTIONS) { return 204; }
    }

    # The build directory also holds tablemate_itinerary.r1cs, .sym and _js/, verification_key.json
    # and ptau/, and none of those may be published, so everything else is refused rather than served.
    location / { return 404; }
}
