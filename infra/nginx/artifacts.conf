# Rendered by the nginx entrypoint to /etc/nginx/conf.d/default.conf inside `http {}`; reads WEB_ORIGIN only.

# Artefact file names are stable across circuit builds, so immutable caching is safe only because every client
# verifies a download against the manifest's SHA-256 and fetches it again on a mismatch. The manifest always
# revalidates: it is the reference those checks are made against, so a stale copy would vouch for the wrong key.
map $uri $tm_cache_control {
    default                    "no-cache";
    /tablemate_itinerary.wasm  "public, max-age=31536000, immutable";
    /tablemate_itinerary.zkey  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    # No [::]:80: the published port and the compose healthcheck both reach the container on 127.0.0.1.

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/artifacts;
    autoindex off;

    # gzip would disable byte ranges and drop the Content-Length the native client's resumable download and
    # its progress reporting read, and the proving key is already compressed.
    gzip off;
    # One range per response: what a resumed download asks for, without the multipart bookkeeping.
    max_ranges 1;

    # Every add_header is declared here and never inside a location, because a location-level one replaces the
    # inherited set and would drop this policy there. `always` carries them on 206, 304, 404 and 416 responses too,
    # and on the preflight 204. The origin below must equal the browser-facing web origin exactly, because a browser
    # refuses an allow-origin that is not its own and the web app's CSP admits only that origin; one fixed value
    # needs no Vary: Origin, and a native download sends no Origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "${WEB_ORIGIN}" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Access-Control-Max-Age "86400" always;
    # Deliberately without `always`: the 404 every artefact request answers before `pnpm circuits:build`
    # has produced the build directory must never be cached.
    add_header Cache-Control $tm_cache_control;

    # Liveness for the compose healthcheck; it reads no file, so the service is healthy before the artefacts exist.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The three files that may be published, and no other file of the build directory. A return-only `if`
    # is the safe form inside a location, and every server-level header still applies here.
    location = /tablemate_itinerary.wasm {
        # Required by WebAssembly.instantiateStreaming.
        types { application/wasm wasm; }
        if ($request_method = OPTIONS) { return 204; }
    }

    location = /tablemate_itinerary.zkey {
        types { }
        default_type application/octet-stream;
        if ($request_method = OPTIONS) { return 204; }
    }

    location = /artifacts.manifest.json {
        types { application/json json; }
        if ($request_method = OPTIONS) { return 204; }
    }

    # The build directory also holds the r1cs, .sym and _js/ trees, verification_key.json and ptau/.
    location / { return 404; }
}
