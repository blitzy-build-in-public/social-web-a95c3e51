# Rendered by the nginx entrypoint to /etc/nginx/conf.d/default.conf, substituting the two bare
# origins the container defines: API_ORIGIN (the browser-facing API) and ARTIFACTS_ORIGIN (the proving
# artefacts). An origin left undefined stays an unreplaced token and fails `nginx -t` with "unknown
# variable", deliberately: the Dockerfile and compose own the values. This file is included inside
# http {}, so the maps below are legal here.

# The chat socket is opened against the API host and the contract carries no separate WS origin, so it
# is derived from API_ORIGIN. A WS host that ever differs from the API host needs its own connect-src
# entry in the policy below.
map "${API_ORIGIN}" $api_ws_origin {
    default               "";
    "~^https://(?<h>.+)$" "wss://$h";
    "~^http://(?<h>.+)$"  "ws://$h";
}

# Evaluated at header time against the finally served $uri, so a client route answered through the
# fallback below is cached like the entry document rather than like a bundle.
map $uri $tm_cache_control {
    default            "no-cache";
    "~^/_expo/static/" "public, max-age=31536000, immutable";
    "~^/assets/"       "public, max-age=31536000, immutable";
}

# The access-log path without its query string. No default, so a source that matched nothing logs an
# empty path rather than a query-bearing value; the regex matches every non-empty $request_uri.
map $request_uri $tm_path {
    "~^(?<p>[^?]*)" $p;
}

# Not $request, $request_uri, $args, $query_string or $http_referer: a magic link arrives as
# /auth/verify?token=… and no token may reach a log through any of them.
log_format tm_noquery '$remote_addr [$time_local] "$request_method $tm_path $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    # No [::]:80 — not every Docker host has IPv6. Health checks must target 127.0.0.1, not localhost,
    # where a resolver preferring ::1 would reach a socket that does not exist.

    server_tokens off;
    # Redirects must not carry the container's internal port 80: the app is reached on 8080.
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log tm_noquery;

    # Every add_header is declared here and never inside a location: a location-level one replaces the
    # whole inherited set, dropping this policy on exactly the routes that need it too.

    # One policy on one line: a header value cannot span lines, and two CSP headers would intersect. It
    # governs the proving Worker's own script response as well, a dedicated Worker being bound by the
    # policy of the script it loads, which is where 'wasm-unsafe-eval' applies — snarkjs, wasmcurves and
    # the witness calculator compile WebAssembly — while scripts are never granted 'unsafe-inline' or
    # 'unsafe-eval'. The Stripe hosts are Stripe's published Stripe.js list for the Payment Element with
    # handleNextAction (docs.stripe.com/security/guide), js.stripe.com sitting in frame-src because
    # Stripe.js injects its script from there. 'unsafe-inline' is granted to styles alone, because
    # react-native-web writes its rules through the CSSOM and the export's index.html carries an inline
    # reset <style>: under style-src 'self' the app renders unstyled.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ${API_ORIGIN} $api_ws_origin ${ARTIFACTS_ORIGIN} https://api.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # /auth/verify?token=… holds a single-use token that a Referer would hand to Stripe or anyone else.
    add_header Referrer-Policy "no-referrer" always;
    # Deliberately without `always`, so a 404 for a missing hashed bundle is not cached for a year.
    add_header Cache-Control $tm_cache_control;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # text/html is always compressed and is not listed.
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/wasm;

    # Liveness for the compose healthcheck, independent of the exported bundle.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed names: a missing file is a 404, never the entry document served as a script, so a
    # stale bundle URL fails loudly instead of being served index.html as JavaScript.
    location ^~ /_expo/ {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Every other path is a client route (/auth/verify, /meetups/<id>, /ops, …), so it serves the entry
    # document and Expo Router renders the route from it.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
