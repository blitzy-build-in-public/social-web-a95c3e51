# Criterion 8 on native (AAP 0.12.1): every capability of the AAP 0.5.8 navigation table that a flow
# without a locked meetup can reach is walked from the tab bar on iOS and Android — proof import,
# discovery, proposal up to the card step, block, report, the lodging directory with both of its
# leaderboard sorts, the lodging claim, the visibility toggle and account deletion (AAP 0.11.2). The
# capabilities that need a locked meetup — accept and lock, check-in, messaging, Report a problem and
# day-plan suggestions — are reached in criterion1-initiator.yaml and criterion1-recipient.yaml, which
# run in Stripe test mode only.
#
# This flow needs no counterpart: the magic-link budget of five links per address per hour (AAP 0.5.4)
# leaves no link for one, so it works with actor A alone — and in test mode it reuses the session
# criterion1-initiator leaves on the device rather than spending one of A's links.
#
# Maestro binds a literal flow-header value over a command-line `-e`, so every default below reads the
# incoming value first. API_URL and MAILPIT_URL are the origins the harness script's own HTTP requests
# use, and DEV_CLIENT_URL is the expo-development-client project link a development build needs before
# it will load (empty for an internal or bench build, where launchApp reaches the app on its own).
appId: com.tablemate.app
name: reachability
tags: [e2e]
env:
  API_URL: ${API_URL || 'http://localhost:3000'}
  MAILPIT_URL: ${MAILPIT_URL || 'http://localhost:8025'}
  DEV_CLIENT_URL: ${DEV_CLIENT_URL || ''}
---
# The harness's fixture data: both actors, the partner venue with its city, and the stay window
# (AAP 0.11.2). apps/mobile/e2e/playwright/support/api-actor.ts wrote it in its `prepare-maestro` run,
# which scripts/e2e.ts performs before any flow. It carries no proof and no token: both actors hold a
# valid proof by then, and the device signs in with a link of its own.
- runScript:
    file: ../../../../.local/e2e/fixture-proofs.js

# Launch, granting the permissions the device flows need and clearing no state: a session already on
# the device is what this flow prefers to reuse.
- launchApp:
    permissions:
      location: allow
      camera: allow
      notifications: allow
- runFlow:
    when:
      true: ${DEV_CLIENT_URL !== ''}
    commands:
      - openLink: ${DEV_CLIENT_URL}
- extendedWaitUntil:
    visible:
      id: 'tab-discover|sign-in-email'
    timeout: 60000

# A's session may already be on the device: criterion1-initiator signs A in, and this flow runs second.
# It is A's session only if the discovery list holds B — B is the other traveler of the venue's city,
# and discovery never lists the caller — so a missing B means another account is signed in and it is
# signed out rather than used.
- runFlow:
    when:
      visible:
        id: tab-discover
    commands:
      - tapOn:
          id: tab-discover
      # Optional, so that B's absence warns instead of failing: the block below is what reacts to it.
      - extendedWaitUntil:
          visible:
            id: traveler-${output.e2e.actors.b.userId}
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: traveler-${output.e2e.actors.b.userId}
          commands:
            - tapOn:
                id: tab-profile
            - tapOn:
                id: profile-settings
            - tapOn:
                id: settings-logout
            - extendedWaitUntil:
                visible:
                  id: sign-in-email
                timeout: 15000

# Sign A in when the device holds no session. In mock mode this is A's only device link on the stack.
- runFlow:
    when:
      visible:
        id: sign-in-email
    commands:
      - runScript:
          file: scripts/read-magic-link.js
          env:
            EMAIL: ${output.e2e.actors.a.email}
            ROLE: device actor a
            API_URL: ${API_URL}
            MAILPIT_URL: ${MAILPIT_URL}
      - openLink: tablemate://auth/verify?token=${output.token}
      # iOS asks before it hands a custom scheme to the app that registered it.
      - runFlow:
          when:
            platform: iOS
            visible: Open
          commands:
            - tapOn: Open
      - extendedWaitUntil:
          visible:
            id: 'age-gate-adult|tab-discover'
          timeout: 60000
      - runFlow:
          when:
            visible:
              id: age-gate-adult
          commands:
            - tapOn:
                id: age-gate-adult
            - assertVisible:
                id: age-gate-submit
                enabled: true
            - tapOn:
                id: age-gate-submit
      - extendedWaitUntil:
          visible:
            id: tab-discover
          timeout: 60000

# Leaving a pushed screen for the tab bar takes no single command: Maestro's `back` is Android and web
# only, and the Android header's back arrow is drawn without a label, so Android presses the system
# back while iOS taps the header's back button, which the root Stack labels `Back` through its
# `headerBackTitle`. Each pair of those two commands below is one departure, and it appears only where
# a screen is actually pushed: at the tab bar itself, the Android back would leave the app.
#
# Capability: discovery (Discover tab, AAP 0.5.8) — the travelers holding a valid proof for A's city.
- tapOn:
    id: tab-discover
- assertVisible:
    id: traveler-${output.e2e.actors.b.userId}

# Capability: proposal (Discover → traveler → Propose, AAP 0.5.8). The framing copy of A's variant,
# the safety notice and the submit control after it are asserted as the screen orders them (AAP
# 0.12.2), and nothing is submitted: no meetup, no card hold and no funnel event exists when the flow
# ends. The submit control is asserted enabled first, because it is disabled until A's own profile has
# loaded.
- tapOn:
    id: traveler-${output.e2e.actors.b.userId}
- assertVisible:
    id: user-profile
- assertVisible:
    id: user-propose
    enabled: true
- tapOn:
    id: user-propose
- scrollUntilVisible:
    element:
      id: safety-notice
    direction: DOWN
    centerElement: true
- assertVisible:
    id: deposit-copy
- assertVisible: ".*(Hold a seat at the table|You'll lose).*"
- assertVisible:
    id: safety-notice
- assertVisible:
    id: propose-submit
    below:
      id: safety-notice

# Capability: block (traveler profile → More → Block, AAP 0.5.8). The confirmation is opened once and
# closed with its own Cancel: a confirmed block has no undo (AAP 0.7.2 carries no unblock route) and
# would break every later suite that pairs A with B, which is why the confirm control — it reuses the
# `user-block` id — is never pressed twice. `user-block-cancel` exists only in the confirmation, so
# asserting it is what proves the confirmation is the state on screen.
- tapOn:
    id: user-more
- tapOn:
    id: user-block
- assertVisible:
    id: user-block-cancel
- tapOn:
    id: user-block-cancel
- assertVisible:
    id: user-propose

# Capability: report (traveler profile → More → Report, AAP 0.5.8). The reason is this flow's own
# text, the report is filed against B once, and Done leaves the success state for B's profile.
- tapOn:
    id: user-report
- tapOn:
    id: report-reason
- inputText: Maestro reachability check
- tapOn:
    id: report-submit
- assertVisible:
    id: report-success
- tapOn:
    id: report-done

# Leave B's profile for the tab bar.
- runFlow: { when: { platform: iOS }, commands: [{ tapOn: { text: 'Back' } }] }
- runFlow: { when: { platform: Android }, commands: [back] }

# Capability: proof import (Profile → Verify my stay, AAP 0.5.8). The picker is asserted and never
# used: the file picker, the share sheet and proving itself are covered by zk-bench.yaml and by the
# web suite, and A's booking is already spent.
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-verify-stay
- assertVisible:
    id: proof-import-pick

- runFlow: { when: { platform: iOS }, commands: [{ tapOn: { text: 'Back' } }] }
- runFlow: { when: { platform: Android }, commands: [back] }

# Capability: the lodging directory and both leaderboard sorts (Lodgings tab, AAP 0.5.8; criterion 15).
# A row's id holds the lodging's own UUID, so the pattern ties the assertion to the seeded directory
# rather than to the sort controls.
- tapOn:
    id: tab-lodgings
- assertVisible:
    id: lodgings-sort-activity
- assertVisible:
    id: 'lodging-[0-9a-f-]{36}'
- tapOn:
    id: lodgings-sort-name
- assertVisible:
    id: 'lodging-[0-9a-f-]{36}'

# Capability: the lodging claim (Lodgings → lodging → I'm staying here, AAP 0.5.8). The consent control
# is asserted in the state the app gives it on arrival — the notice is not rendered until the booking
# details are filled in, and the switch stays disabled until it is (AAP 0.12.2) — and nothing is
# submitted, so no verification call and no call task exists for A when the flow ends. A lodging whose
# `lodging-claim-start` is missing because A already holds an active claim fails here by name.
- tapOn:
    id: 'lodging-[0-9a-f-]{36}'
    index: 0
- assertVisible:
    id: lodging-claim-start
- tapOn:
    id: lodging-claim-start
- assertNotVisible:
    id: claim-notice
- assertVisible:
    id: claim-consent
    enabled: false
- assertVisible:
    id: claim-submit
    enabled: false

# Leave the claim screen and then the lodging for the tab bar.
- runFlow: { when: { platform: iOS }, commands: [{ tapOn: { text: 'Back' } }] }
- runFlow: { when: { platform: Android }, commands: [back] }
- runFlow: { when: { platform: iOS }, commands: [{ tapOn: { text: 'Back' } }] }
- runFlow: { when: { platform: Android }, commands: [back] }

# Capability: the visibility toggle (Profile → My stay, AAP 0.5.8). With no verified claim the screen
# offers the directory instead of the toggle; with one it shows the safety warning before the toggle
# (AAP 0.12.2). Nothing is toggled either way, because the API answers 409 no_verified_claim without a
# verified claim.
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-my-stay
- assertVisible:
    id: stay
- runFlow:
    when:
      visible:
        id: stay-claim
    commands:
      - assertVisible:
          id: stay-warning
      - assertVisible:
          id: stay-toggle
          below:
            id: stay-warning

- runFlow: { when: { platform: iOS }, commands: [{ tapOn: { text: 'Back' } }] }
- runFlow: { when: { platform: Android }, commands: [back] }

# Capability: account deletion (Profile → Settings → Delete account, AAP 0.5.8), the flow's last step
# because it ends the session. It deletes a throwaway account created here rather than A, whom later
# flows still need, and a new account's age gate is reached and passed on the way in.
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-settings
- tapOn:
    id: settings-logout
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 15000
- evalScript: ${output.throwaway = 'e2e-delete-' + maestro.platform + '-' + Math.random().toString(16).slice(2, 10) + '@example.com'}
- runScript:
    file: scripts/read-magic-link.js
    env:
      EMAIL: ${output.throwaway}
      ROLE: throwaway
      API_URL: ${API_URL}
      MAILPIT_URL: ${MAILPIT_URL}
- openLink: tablemate://auth/verify?token=${output.token}
- runFlow:
    when:
      platform: iOS
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: age-gate-adult
    timeout: 60000
- tapOn:
    id: age-gate-adult
- assertVisible:
    id: age-gate-submit
    enabled: true
- tapOn:
    id: age-gate-submit
- extendedWaitUntil:
    visible:
      id: tab-discover
    timeout: 60000
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-settings
- tapOn:
    id: settings-delete-account
# One control, pressed twice: the first press opens the final confirmation, the second issues
# DELETE /me. `delete-account-cancel` exists only inside the confirmation, so waiting for it is what
# separates the two presses.
- tapOn:
    id: delete-account-confirm
- extendedWaitUntil:
    visible:
      id: delete-account-cancel
    timeout: 10000
- tapOn:
    id: delete-account-confirm
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 30000
