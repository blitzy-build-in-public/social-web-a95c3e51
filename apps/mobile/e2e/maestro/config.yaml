# Maestro workspace configuration: it fixes the order this folder's native end-to-end flows run in,
# which the magic-link budget requires. POST /v1/auth/magic-link allows five links per address per hour
# (AAP 0.5.4), and actor A has two per platform: the device sign-in in criterion1-initiator, which
# reachability reuses, and the API-side counterpart sign-in in criterion1-recipient. Maestro's own
# discovery order does not hold that — it is undocumented, it is not the file-name order, and here it
# reaches reachability first: with no session on the device reachability spends one of A's links and
# then ends signed out, because its last capability deletes a throwaway account, so criterion1-initiator
# must spend a second device link for A and A is asked for six over two platforms for the five the route
# allows.
#
# Every entry matches its flow's header `name`, which is also its file stem. zk-bench.yaml is absent
# deliberately: it carries the `bench` tag and an end-to-end run must never select it. Tag selection
# stays on the command line (`--include-tags e2e`, passed by e2e:native), so no flows/includeTags/
# excludeTags key appears here; scripts/e2e.ts hands Maestro the three flow files one at a time and
# reads none of this. continueOnFailure: false stops the rest of this sequence as soon as one flow
# fails, so a broken run does not spend the remaining flows' links.
#
# Maestro 2.12.1 mishandles a run whose tag filter drops a listed flow — issue #1681: the ordered
# sequence silently loses entries, or the run aborts with "Could not find flows needed for execution in
# order" (the fix in PR #3600 is unreleased) — so never run this folder with a filter that excludes one
# of the three: `--include-tags stripe-test` alone drops reachability.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - criterion1-initiator
    - reachability
    - criterion1-recipient
