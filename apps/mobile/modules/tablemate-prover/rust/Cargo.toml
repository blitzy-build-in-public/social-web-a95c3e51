# Native prover crate for the iOS and Android development builds: mopro 0.3.7's Circom adapter, with rust-witness generating the witness and rapidsnark producing the Groth16 proof.
# Cargo.lock beside this file is generated by `cargo generate-lockfile`, committed as written and never hand-edited.

[package]
name = "tablemate-prover"
version = "0.1.0"
edition = "2021"
publish = false

# The library identifier must stay `mopro_bindings`: mopro-ffi 0.3.7 reads [lib].name to name the archives it produces — libmopro_bindings.a for iOS and libmopro_bindings.so for Android — which ../ios and ../android link and load.
[lib]
name = "mopro_bindings"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["uniffi"]
uniffi = ["mopro-ffi/uniffi"]

[dependencies]
# Default features are required: the `build` feature supplies mopro_ffi::app_config::{ios,android}::build(), which src/bin/ios.rs and src/bin/android.rs call.
mopro-ffi = "=0.3.7"
# rustwitness and rapidsnark are this app's witness and proving backends; the `arkworks` default feature is unused, and rapidsnark already pulls the arkworks crates it needs.
circom-prover = { version = "=0.1.4", default-features = false, features = ["rustwitness", "rapidsnark"] }
# `witness!` in src/lib.rs generates the circuit's witness function.
rust-witness = "=0.1.6"
serde_json = "=1.0.154"
# The Swift and Kotlin bindings come from uniffi 0.32.0 through mopro-ffi's `uniffi` feature above, which requires that exact version.
# It must not be declared here: `uniffi` in the extern prelude would collide with mopro_ffi::app!(), which expands to `extern crate mopro_ffi as uniffi;` and is rejected by rustc as a macro-expanded extern crate shadowing an --extern name, leaving `uniffi::export` ambiguous (E0659).

[build-dependencies]
# build.rs transpiles the compiled circuit WASM into linkable Rust.
rust-witness = "=0.1.6"
uniffi = "=0.32.0"
