<script>
// Three independent attempts, so a refusal or exception in one never stops the
// others from being attempted and counted.
try {
  navigator.serviceWorker?.register('sw.js').catch(() => {});
} catch {}
try {
  fetch('http://169.254.169.254/').catch(() => {});
} catch {}
try {
  const ws = new WebSocket('ws://' + location.host + '/ws');

} catch {}
