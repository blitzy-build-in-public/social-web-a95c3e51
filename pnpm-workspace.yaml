packages:
  - apps/*
  - packages/*

# Workspace-wide settings live here: pnpm 12 ignores the `pnpm` field in package.json and
# every non-auth .npmrc setting, so the settings below are the authoritative copies of what
# the plan states in that field and in .npmrc.
#
# Expo SDK 52 (React Native 0.76.9) Metro and native autolinking do not work with pnpm's
# isolated node_modules layout; Expo's own pnpm template uses the hoisted linker.
nodeLinker: hoisted
# Exact version pins: every dependency is declared at its resolved version and no range.
saveExact: true
# The root scripts `test:stripe` and `perf` run `VAR=value cmd`, which needs shell emulation.
shellEmulator: true
# pnpm 12 enforces the root `packageManager` pin itself and records the pnpm version it resolved
# for the project in a leading "env" document of pnpm-lock.yaml, which turns that file into a
# two-document YAML stream no single-document consumer (js-yaml's load, PyYAML, dependency-review,
# SBOM and licence scanners) can read. Ignoring the pin at install time leaves pnpm nothing to
# record, so it writes one document holding all nine importers; corepack still activates the
# pinned 12.16.1 from the root manifest's `packageManager` field, which is the install path the
# images use.
pmOnFail: ignore

# The snarkjs override replaces the git-hosted fork that @zk-email/helpers declares;
# without it pnpm refuses the install with ERR_PNPM_EXOTIC_SUBDEP.

overrides:
  snarkjs: 0.7.6
  # jsonpath, reached through snarkjs's bfj dependency, pins underscore at exactly 1.13.6,
  # which carries GHSA-qpx9-hpmf-5gmw (unlimited recursion in _.flatten and _.isEqual) and
  # would fail the repository-wide `pnpm audit --prod` gate. Pin the patched release of the
  # same series instead.
  underscore: 1.13.8

  # The @tablemate/mobile manifest pulls the Expo SDK 52 toolchain into the production graph,
  # and every package below reaches the tree only through it. The manifest's own pins are the
  # AAP's Expo SDK 52 pins and stay untouched, so the patched releases are selected here.
  #
  # tar 6.2.1, via @expo/cli, carries the critical GHSA-23hp-3jrh-7fpw and eight high and
  # three moderate advisories, the last of which (GHSA-r292-9mhp-454m) requires 7.5.21.
  tar: 7.5.21
  # @xmldom/xmldom 0.7.13, via @expo/plist, carries thirteen high and two moderate XML
  # injection and denial-of-service advisories; 0.8.15 patches every one of them. Scoped below
  # 0.9: the 0.9.12 that plist resolves is already outside every advisory's range, and a blanket
  # pin would drop it under that package's own ^0.9.10 for no gain.
  '@xmldom/xmldom@<0.9': 0.8.15
  # postcss 8.4.49, via @expo/metro-config, carries the high GHSA-6g55-p6wh-862q and
  # GHSA-r28c-9q8g-f849 (arbitrary file read) and two moderate advisories, all cleared from
  # 8.5.23; 8.5.32 is the release vite already resolves.
  postcss: 8.5.32
  # image-size 1.2.1, via metro, carries the high GHSA-5p2g-fcmc-qvqq and
  # GHSA-w3rx-r6r6-pgpr (parser denial of service). Their patched line starts at 2.0.3, which
  # still ships a CommonJS build. Known cost, accepted here: metro 0.81.5 calls this module as
  # a function (src/Assets.js getAssetSize/getAssetData, reached by metro-transform-worker and
  # @expo/metro-config for every asset), and 2.0.3 exposes named exports only, so those call
  # sites throw until metro's own import is adapted. No patched release keeps the callable
  # form, so the choice is this or a high advisory in the gate.
  image-size: 2.0.3
  # decode-uri-component 0.2.2, via the mobile manifest's query-string, carries the high
  # GHSA-qr28-fpjm-wq7f (quadratic decoding denial of service) and GHSA-vcc3-ghjq-m6fr;
  # 0.5.1 is the first patched release. Known cost, accepted here: 0.5.1 is ESM-only, and
  # query-string 7.1.3 requires it as a callable CommonJS module (index.js line 3 and 233),
  # so that call site throws until query-string's own import is adapted.
  decode-uri-component: 0.5.1
  # ajv 8.11.0, via expo-dev-client > expo-dev-launcher, carries GHSA-2g4f-4pwh-qvx6 (ReDoS
  # through the `$data` option); 8.18.0 is the first patched release and 8.20.0 is the release
  # schema-utils already resolves. Scoped to the 8.x line: the ajv 6 that ESLint resolves sits
  # outside the advisory's range and does not accept ajv 8's option set.
  'ajv@^8.0.0': 8.20.0

# `pnpm audit --prod` reports no high or critical advisories (AAP 0.11.2). The four advisories
# below are moderate or low and reach the tree only through the Expo SDK 52 toolchain, whose
# consuming packages pin ranges no patched release fits; forcing the release that does exist
# would be a major jump onto a chain this host cannot build or run. They are accepted here, and
# every high and critical advisory in the same graph is pinned to a patched release above.
auditConfig:
  ignoreGhsas:
    # glob 10.5.0, via @expo/config. The only patched release is 14.0.2, a major jump from the
    # 10.x that @expo/config pins and that expo-module-scripts' jest chain shares.
    - GHSA-3g3m-2fjr-6pw4
    # minimatch 9.x and 10.x, via the same glob chains. The only patched release is 11.0.1,
    # a major jump from the lines Expo SDK 52's config and glob chains pin.
    - GHSA-g3hv-75wg-m249
    # uuid 7.x and 8.x, via xcode and @expo/config-plugins. The only patched release is 11.1.1,
    # a major jump from the lines those packages pin.
    - GHSA-w5hq-g745-h8pq
    # deepmerge 4.3.1, via @expo/config. No patched release exists: its patched_versions is null.
    - GHSA-gcqx-w48m-w2h4

# pnpm 11 replaced onlyBuiltDependencies with allowBuilds. Without these entries pnpm
# exits 1 with ERR_PNPM_IGNORED_BUILDS and the Prisma engines, the esbuild binary and
# the native addons below are never built.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@zk-email/zk-regex-circom': true
  blake-hash: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  ssh2: true

# image-size 2.0.3 clears the high GHSA-5p2g-fcmc-qvqq and GHSA-w3rx-r6r6-pgpr (parser denial
# of service), and decode-uri-component 0.5.1 clears the high GHSA-qr28-fpjm-wq7f and
# GHSA-vcc3-ghjq-m6fr, but no patched release of either keeps the callable form its consumer
# needs. The two patches below carry that difference instead of reverting a pin or widening the
# ignore list: image-size 2.x is not itself callable and takes a Uint8Array alone, so metro
# 0.81.5 (src/Assets.js getAssetSize/getAssetData) also needs the asset file path it passes read
# for it; decode-uri-component 0.5.1 is ESM-only, so query-string 7.1.3 (index.js line 3)
# resolves its default export.
#
# tar and xcode are patched for the same reason: the pin and the consumer disagree, and the
# difference has no release to carry it. The tar override above forces the 7.x line onto
# @expo/cli 0.22.28, which unpacks the project template through
# `interopDefault(require('tar')).default.extract`, while tar 7's CommonJS entry exports the
# function under its own name and marks the module as ESM — so prebuild died on
# "Cannot read properties of undefined (reading 'extract')". xcode 3.0.1 reads a group's path
# without checking that the template has such a group, which Expo SDK 52's iOS project does not
# have for the 'Resources' group expo-share-intent's share-extension target asks for; the patch
# mirrors the fix expo-share-intent's own installation notes point at. Each patch adds a guard
# only: no pin moves, no advisory is ignored, and no consumer's behaviour changes beyond the
# call it was already making.
patchedDependencies:
  metro@0.81.5: patches/metro@0.81.5.patch
  query-string@7.1.3: patches/query-string@7.1.3.patch
  tar@7.5.21: patches/tar@7.5.21.patch
  xcode@3.0.1: patches/xcode@3.0.1.patch
